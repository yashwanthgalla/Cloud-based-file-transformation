apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: convpdf-ingress
  namespace: convpdf
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/abc-123-def
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: '200'
spec:
  rules:
    - host: convpdf.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: convpdf-backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: convpdf-frontend-service
                port:
                  number: 80
