apiVersion: apps/v1
kind: Deployment
metadata:
  name: convpdf-worker
  namespace: convpdf
  labels:
    app: convpdf
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: convpdf
      tier: worker
  template:
    metadata:
      labels:
        app: convpdf
        tier: worker
    spec:
      containers:
        - name: worker
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/convpdf-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: convpdf-config
            - secretRef:
                name: convpdf-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convpdf-redis
  namespace: convpdf
  labels:
    app: convpdf
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: convpdf
      tier: cache
  template:
    metadata:
      labels:
        app: convpdf
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: convpdf-redis-service
  namespace: convpdf
  labels:
    app: convpdf
    tier: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: convpdf
    tier: cache
