apiVersion: v1
kind: ConfigMap
metadata:
  name: convpdf-config
  namespace: convpdf
  labels:
    app: convpdf
data:
  NODE_ENV: "production"
  PORT: "5000"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "convpdf-production-storage"
  REDIS_HOST: "convpdf-redis-service"
  REDIS_PORT: "6379"
  MAX_FILE_SIZE_MB: "50"
  ALLOWED_ORIGINS: "https://convpdf.example.com"
  WORKER_CONCURRENCY: "4"
  LOG_LEVEL: "info"
