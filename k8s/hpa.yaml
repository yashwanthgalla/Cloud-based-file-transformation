apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: convpdf-backend-hpa
  namespace: convpdf
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: convpdf-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: convpdf-worker-hpa
  namespace: convpdf
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: convpdf-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
