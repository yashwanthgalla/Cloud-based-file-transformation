---
- name: ConvPDF Infrastructure Provisioning and App Deployment
  hosts: app_servers
  become: yes
  gather_facts: yes

  vars:
    app_dir: /opt/convpdf
    app_version: "{{ deploy_version | default('latest') }}"

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

  roles:
    - role: docker
      tags: [docker, provision]
    - role: convpdf-app
      tags: [app, deploy]

  post_tasks:
    - name: Verify application endpoint is responding
      uri:
        url: "http://localhost:5000/api/health"
        status_code: 200
        return_content: yes
      register: health_check
      retries: 6
      delay: 5
      until: health_check.status == 200
      tags: [verify]
